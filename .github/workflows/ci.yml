# CI for FP-RISC on a stock x86-64 runner.
#
# Debian trixie container: fp-risc.cabal needs libgit2 >= 1.9
# (pkgconfig-depends), which Ubuntu 24.04 does not ship; trixie's GHC
# 9.6 and its libghc-* packages provide the Haskell dependencies.
# One job: building the compiler dominates, and the checks
# all need the same tree.
#
# Covered: tests/check_base.py (the umbrella: hosted x86-64 builds and
# runs, the x64 lowering checks, typed vectors, POSIX modules, clang
# vector limits and POSIX PIC, the RV64 Unix lowering), check_i32 and
# check_raw, and the RV64 Linux suite cross-built with
# riscv64-linux-gnu-gcc and run under qemu-user.
# check_raw also covers builtin images with the installed bare-metal tools.
# Also covered: Tang Nano RV32 Base examples/custom programs in QEMU,
# RV32/RV64 argument regressions and both repositories' preset gates.
# Not covered: physical boards, vendor synthesis, macOS/AArch64 hosts.
name: ci

on:
  push:
    branches: [main, typed-ir-retire, codex/a64-overflow-checks-20261020, codex/typed-ir-migration-20261022]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DEBIAN_FRONTEND: noninteractive
  LC_ALL: C.UTF-8

jobs:
  x86-64:
    name: x86-64 (debian trixie)
    runs-on: ubuntu-latest
    container: debian:trixie
    timeout-minutes: 150
    steps:
      - name: tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates python3 zstd \
            make gcc libc6-dev pkg-config ghc cabal-install libghc-megaparsec-dev \
            libghc-network-dev libghc-utf8-string-dev libgit2-dev libarchive-dev \
            libegl-dev libgl-dev clang lld \
            gcc-riscv64-linux-gnu libc6-dev-riscv64-cross qemu-user \
            gcc-riscv64-unknown-elf picolibc-riscv64-unknown-elf qemu-system-misc
      - uses: actions/checkout@v4
      - name: matching SimpleRisc preset
        uses: actions/checkout@v4
        with:
          repository: hyperswine/simple-risc
          ref: 8479466ba159ebaf4faf035502dfc3b6354b2083
          path: .ci/simple-risc
      - name: cabal build (Linux x86-64)
        run: |
          cabal update
          cabal build
      - name: make fpr
        run: |
          make fpr
          ./fpr --version || test -x ./fpr
      # in a container job ${{ github.workspace }} is the HOST's path;
      # $GITHUB_WORKSPACE is the one the container sees
      - run: echo "FPR_HOME=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
      - name: Typed IR direct backends (Linux x86-64)
        run: |
          python3 -u tests/check_typed_ir_a64.py
          python3 -u tests/check_typed_ir_x64.py --require-execution
          python3 -u tests/check_typed_ir_x64.py --require-execution --entry-optimizations
          python3 -u tests/check_typed_ir_aggregates.py
          python3 -u tests/check_typed_ir_coverage.py
          python3 -u tests/check_typed_ir_kernels.py --require-execution
          python3 -u tests/check_typed_ir_bench.py
      - name: Typed IR direct RISC-V (QEMU independent oracles)
        run: |
          python3 -u tests/check_typed_ir_rv.py --width 32 --require-execution
          python3 -u tests/check_typed_ir_rv.py --width 64 --require-execution
          python3 -u tests/check_typed_ir_rv_module.py --require-execution
          python3 -u tests/check_typed_ir_qrv64.py --require-execution
          python3 -u tests/check_typed_ir_esp.py --require-execution
          python3 -u tests/check_typed_ir_builtin.py --require-execution
          python3 -u tests/check_typed_ir_arc.py --require-execution
      - name: Typed IR RV64 Linux (TLS and actor runtime)
        env:
          FPR_TYPED_IR_BACKEND: mixed
        run: |
          python3 -u tests/check_rv64_linux.py --typed-ir --cc riscv64-linux-gnu-gcc \
            --output "$RUNNER_TEMP/rv64-typed" --runner 'qemu-riscv64 -L /usr/riscv64-linux-gnu'

      - name: Tang Nano preset and protocol gates
        env:
          SIMPLE_RISC_ROOT: .ci/simple-risc
        run: |
          python3 -m unittest discover -s tests -p test_tangnano20k_examples.py
          python3 -m unittest discover -s .ci/simple-risc/boards/tangnano20k/sdram -p test_preset_manifest.py
          python3 tests/check_tangnano20k_virtual.py
      - name: Tang Nano SoftFloat (RV32 and RV64)
        run: |
          FPR_PRESET=fprisc-48 machine/tangnano20k/build-softfloat.sh
          FPR_XLEN=64 machine/tangnano20k/build-softfloat.sh
      - name: Typed RV32 float constants and software runtime
        run: python3 -u tests/check_rv32_float_constants.py --require-execution
      - name: Tang Nano examples and custom programs (QEMU)
        run: |
          python3 -u tools/run_tangnano20k_examples.py --target qemu
          python3 -u tests/check_tangnano20k_program.py
      - name: Tang Nano argument limits and GC roots (RV32/RV64 QEMU)
        run: python3 -u tests/check_tangnano20k_args.py
      - name: Tang Nano results and failure logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tangnano-qemu-evidence
          if-no-files-found: warn
          path: |
            build/tangnano20k-examples/**/*.json
            build/tangnano20k-examples/**/*.log
            build/tangnano20k-program-check/**/*.json
            build/tangnano20k-program-check/**/*.log
            build/tangnano20k-args/**/*.json
            build/tangnano20k-args/**/*.log

      - name: check_base (the typed backend is the default)
        run: python3 -u tests/check_base.py --skip-typed-ir-native
      - name: RISC-V legacy rollback
        run: python3 -u tests/check_self_loop_rv64.py
      # check_raw also boots builtin/raw images on qemu-system-riscv64
      - name: check_i32, check_raw
        run: |
          python3 -u tests/check_i32.py
          python3 -u tests/check_raw.py
      - name: Experimental frame and register modes (native x86-64)
        env:
          FPR_COSTED_REGISTERS: "1"
          FPR_COMPACT_FRAMES: "1"
          FPR_SELF_LOOPS: "1"
        run: |
          python3 -u tests/check_self_loops.py
          python3 -u tests/check_workers.py
          python3 -u tests/check_registers.py
      - name: RV64 Linux (cross-built, qemu-user)
        run: |
          python3 -u tests/check_rv64_linux.py --cc riscv64-linux-gnu-gcc \
            --output "$RUNNER_TEMP/rv64" --runner 'qemu-riscv64 -L /usr/riscv64-linux-gnu'
